name: Publish Document
on:
  push:
    branches:
      - main  # Trigger this workflow whenever the main branch changes
  pull_request:
    branches:
      - main  # Validate AI contracts and strict docs builds before merge
  workflow_dispatch:    # Allow manual triggering of this workflow via the "Run workflow" button on the GitHub UI Actions tab
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7  # Action that checks out the repository
      with:
        persist-credentials: false   # Disable auto-injection of GITHUB_TOKEN so a higher-privilege token can be supplied in later steps
        fetch-depth: 0   # Required by mkdocs-git-revision-date-localized-plugin to compute per-page last-updated

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.22.3'

    - name: Install locked Swagger UI assets without lifecycle scripts
      run: |
        npm ci --ignore-scripts --no-audit
        npm audit --omit=dev --audit-level=high

    - name: Verify AI-readable source consistency
      run: node scripts/verify-ai-consistency.mjs

    - name: Test API acceptance output contracts
      run: node --test scripts/api-acceptance.test.mjs

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install locked documentation dependencies in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/docs-venv"
        "$RUNNER_TEMP/docs-venv/bin/python" -m pip install -r requirements-bootstrap.txt
        "$RUNNER_TEMP/docs-venv/bin/python" -m pip install -r requirements.txt
        "$RUNNER_TEMP/docs-venv/bin/python" -m pip check
        echo "$RUNNER_TEMP/docs-venv/bin" >> "$GITHUB_PATH"

    - name: Audit the locked Python build and test dependencies
      run: |
        python -m venv "$RUNNER_TEMP/docs-audit"
        "$RUNNER_TEMP/docs-audit/bin/python" -m pip install -r requirements-bootstrap.txt
        "$RUNNER_TEMP/docs-audit/bin/python" -m pip install pip-audit==2.10.1
        "$RUNNER_TEMP/docs-audit/bin/pip-audit" --no-deps --disable-pip -r requirements-bootstrap.txt -r requirements-test.txt

    - name: Build the document
      run: mkdocs build --strict

    - name: Verify and audit the published Swagger UI bundles
      run: python scripts/verify-swagger-ui.py site

    - name: Verify published documentation and assets
      run: |
        test -f site/.nojekyll
        test -f site/.well-known/security.txt
        cmp docs/.well-known/security.txt site/.well-known/security.txt
        test -f site/ai_support/cli_and_sdk.md
        cmp docs/ai_support/cli_and_sdk.md site/ai_support/cli_and_sdk.md
        grep -q 'type="text/markdown"' site/ai_support/cli_and_sdk/index.html
        test -f site/developers/apis/agent-acceptance-latest.json
        test -z "$(find site/assets -type f \( -name '*.js.map' -o -name '*.css.map' \) -print -quit)"

    - name: Add CNAME file
      run: echo 'docs.justlend.org' > site/CNAME

    - name: Deploy
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.TOKEN}}
        branch: gh-pages # Publish the built site to the gh-pages branch
        folder: site # MkDocs default build output directory
