name: Publish Document
on:
  push:
    branches:
      - main  # Trigger this workflow whenever the main branch changes
  pull_request:
    branches:
      - main  # Validate AI contracts and strict docs builds before merge
  workflow_dispatch:    # Allow manual triggering of this workflow via the "Run workflow" button on the GitHub UI Actions tab
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7  # Action that checks out the repository
      with:
        persist-credentials: false   # Disable auto-injection of GITHUB_TOKEN so a higher-privilege token can be supplied in later steps
        fetch-depth: 0   # Required by mkdocs-git-revision-date-localized-plugin to compute per-page last-updated

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.22.1'

    - name: Verify AI-readable source consistency
      run: node scripts/verify-ai-consistency.mjs

    - name: Test API acceptance output contracts
      run: node --test scripts/api-acceptance.test.mjs

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'   # Match the locked dependency resolution baseline

    - name: Install dependencies
      run: |
        python -m pip install --require-hashes -r requirements-test.lock
        python -m pip check

    - name: Audit locked Python dependencies
      run: |
        python -m venv .audit-venv
        .audit-venv/bin/python -m pip install pip-audit==2.10.1
        .audit-venv/bin/pip-audit --no-deps --disable-pip -r requirements.lock
        .audit-venv/bin/pip-audit --no-deps --disable-pip -r requirements-test.lock

    - name: Test documentation and dependency contracts
      run: |
        node scripts/normalize-mcp-catalog.mjs --check
        python -m unittest scripts.test_dependency_security
        python scripts/test-docs-regressions.py

    - name: Build the document
      run: mkdocs build --strict

    - name: Verify security metadata output
      run: |
        python hooks/secure_swagger.py --site-dir site --audit
        DOCS_SITE_DIR=site python -m unittest scripts.test_dependency_security.BuiltSite
        DOCS_SITE_DIR=site python scripts/test-docs-regressions.py
        test -f site/.nojekyll
        test -f site/.well-known/security.txt
        cmp docs/.well-known/security.txt site/.well-known/security.txt
        test -f site/ai_support/cli_and_sdk.md
        cmp docs/ai_support/cli_and_sdk.md site/ai_support/cli_and_sdk.md
        grep -q 'type="text/markdown"' site/ai_support/cli_and_sdk/index.html
        test -f site/developers/apis/agent-acceptance-latest.json

    - name: Add CNAME file
      run: echo 'docs.justlend.org' > site/CNAME

    - name: Deploy
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.TOKEN}}
        branch: gh-pages # Publish the built site to the gh-pages branch
        folder: site # MkDocs default build output directory
